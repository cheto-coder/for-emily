<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una pregunta importante 🐱💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e7 0%, #ffb3d1 30%, #ffc8e8 60%, #e8b4f8 100%);
      font-family: "Nunito", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart-float {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0.4;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.4;
      }

      90% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      border-radius: 32px;
      padding: 48px 52px;
      max-width: 520px;
      width: 92%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 100, 160, 0.25), 0 0 0 2px rgba(255, 150, 200, 0.3);
      z-index: 10;
      position: relative;
      animation: cardIn 0.8s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes cardIn {
      from {
        transform: scale(0.7) translateY(40px);
        opacity: 0;
      }

      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .cat-container {
      font-size: 6rem;
      margin-bottom: 8px;
      animation: catBounce 2s ease-in-out infinite;
      display: block;
    }

    @keyframes catBounce {

      0%,
      100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-12px) rotate(3deg);
      }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      color: #c0336e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 1rem;
      color: #c06090;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: "Nunito", sans-serif;
      font-weight: 900;
      transition: transform 0.15s, box-shadow 0.15s;
      line-height: 1;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.94);
    }

    #btn-yes {
      background: linear-gradient(135deg, #ff6fa8, #e040a0);
      color: #fff;
      font-size: 1.3rem;
      padding: 18px 38px;
      box-shadow: 0 8px 24px rgba(224, 64, 160, 0.4);
      transition: font-size 0.3s, padding 0.3s, box-shadow 0.3s, transform 0.15s;
    }

    #btn-yes:hover {
      box-shadow: 0 12px 32px rgba(224, 64, 160, 0.55);
      transform: translateY(-3px) scale(1.04);
    }

    #btn-no {
      background: linear-gradient(135deg, #b0b0b0, #888);
      color: #fff;
      font-size: 1.1rem;
      padding: 14px 28px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      transition: font-size 0.3s, padding 0.3s, box-shadow 0.3s, transform 0.15s;
    }

    #no-message {
      min-height: 28px;
      font-size: 0.95rem;
      color: #c06090;
      font-weight: 700;
      margin-top: 18px;
      opacity: 0;
      transition: opacity 0.4s;
    }

    #yes-screen {
      display: none;
      animation: cardIn 0.7s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    #yes-screen .big-cat {
      font-size: 7rem;
      display: block;
      animation: catSpin 0.6s ease;
    }

    @keyframes catSpin {
      0% {
        transform: rotate(-15deg) scale(0.5);
      }

      60% {
        transform: rotate(10deg) scale(1.15);
      }

      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    #yes-screen h2 {
      font-size: 2rem;
      font-weight: 900;
      color: #c0336e;
      margin: 16px 0 10px;
    }

    #yes-screen p {
      color: #c06090;
      font-size: 1.1rem;
    }

    .confetti-piece {
      position: fixed;
      border-radius: 2px;
      animation: confettiFall linear forwards;
      z-index: 999;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="hearts-bg" id="hearts-bg"></div>
  <div class="card" id="main-card">
    <div id="question-screen">
      <span class="cat-container" id="main-cat">🐱</span>
      <h1>Oye… ¿Alguna vez pensaste en intentar algo más que una amistad conmigo? 🥺💕</h1>
      <p class="subtitle">El gatito y yo llevamos tiempo queriendo preguntarte esto… 🐱</p>
      <div class="buttons">
        <button class="btn" id="btn-yes" onclick="handleYes()">💖 ¡Sí, quiero!</button>
        <button class="btn" id="btn-no" onclick="handleNo()">No…</button>
      </div>
      <p id="no-message"></p>
    </div>
    <div id="yes-screen">
      <span class="big-cat">😻</span>
      <h2>¡YAYYYY! 🎉💕</h2>
      <p>Tú y yo, desde ahora.<br>El gatito está muy feliz… y yo también. 🐾❤️</p>
    </div>
  </div>
  <script>
    const emojis = ["💕", "💗", "💖", "🩷", "🌸", "✨", "🐾", "💝", "🐱"];
    const bg = document.getElementById("hearts-bg");
    for (let i = 0; i < 22; i++) {
      const el = document.createElement("span");
      el.className = "heart-float";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = (5 + Math.random() * 8) + "s";
      el.style.animationDelay = (Math.random() * 8) + "s";
      el.style.fontSize = (1 + Math.random() * 1.5) + "rem";
      bg.appendChild(el);
    }
    let noCount = 0;
    const noMessages = [
      "Psst… el gatito se puso triste 🐱💔",
      "¿Segura? El gatito llora… 😿",
      "Nooo, dale otra oportunidad al amor 🥺",
      "Mira qué chiquito quedó el no… 👀",
      "El sí es mucho más bonito, ¿no? 💕",
      "El gatito dice que pienses bien… 🐾",
      "¡Ya casi no puedes presionar el no! 😅",
      "Acéptalo, el sí te está llamando 💖",
      "El no está desapareciendo… 👻",
      "¡Última oportunidad del no! 🙈"
    ];
    const yesBtn = document.getElementById("btn-yes");
    const noBtn = document.getElementById("btn-no");
    const noMsg = document.getElementById("no-message");
    const mainCat = document.getElementById("main-cat");
    const sadCats = ["😿", "🙀", "😾", "😿", "🙀"];
    function handleNo() {
      noCount++;
      const noSize = Math.max(0.4, 1.1 - noCount * 0.08);
      const noPad = Math.max(3, 14 - noCount * 1.2);
      noBtn.style.fontSize = noSize + "rem";
      noBtn.style.padding = noPad + "px " + (noPad * 2) + "px";
      const yesSize = Math.min(2.8, 1.3 + noCount * 0.13);
      const yesPad = Math.min(34, 18 + noCount * 1.6);
      yesBtn.style.fontSize = yesSize + "rem";
      yesBtn.style.padding = yesPad + "px " + (yesPad * 2.1) + "px";
      mainCat.textContent = sadCats[Math.min(noCount - 1, sadCats.length - 1)];
      noMsg.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
      noMsg.style.opacity = "1";
      if (noSize <= 0.4) noBtn.style.visibility = "hidden";
    }
    function handleYes() {
      document.getElementById("question-screen").style.display = "none";
      document.getElementById("yes-screen").style.display = "block";
      launchConfetti();
    }
    function launchConfetti() {
      const colors = ["#ff6fa8", "#ffb3d1", "#e040a0", "#ffd700", "#a78bfa", "#34d399"];
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const el = document.createElement("div");
          el.className = "confetti-piece";
          el.style.left = Math.random() * 100 + "vw";
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.width = (6 + Math.random() * 10) + "px";
          el.style.height = (6 + Math.random() * 10) + "px";
          el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
          el.style.animationDuration = (2 + Math.random() * 2.5) + "s";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 5000);
        }, i * 35);
      }
    }
  </script>
</body>

</html>
