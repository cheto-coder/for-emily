<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Una pregunta importante 🐱💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #ffd6e7 0%, #ffb3d1 30%, #ffc8e8 60%, #e8b4f8 100%);
      font-family: "Nunito", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 16px;
    }

    /* Floating hearts background */
    .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .heart-float { position: absolute; animation: floatUp linear infinite; opacity: 0.45; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.45; }
      90%  { opacity: 0.45; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Card */
    .card {
      background: rgba(255,255,255,0.80);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: clamp(28px, 6vw, 52px) clamp(20px, 6vw, 52px);
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255,100,160,0.25), 0 0 0 2px rgba(255,150,200,0.3);
      z-index: 10;
      position: relative;
      animation: cardIn 0.8s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes cardIn {
      from { transform: scale(0.7) translateY(40px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Cat */
    .cat-container {
      font-size: clamp(4rem, 16vw, 6rem);
      margin-bottom: 10px;
      animation: catBounce 2s ease-in-out infinite;
      display: block;
      line-height: 1;
    }

    @keyframes catBounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-12px) rotate(3deg); }
    }

    h1 {
      font-size: clamp(1.25rem, 5vw, 1.75rem);
      font-weight: 900;
      color: #c0336e;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .subtitle {
      font-size: clamp(0.9rem, 3.5vw, 1rem);
      color: #c06090;
      margin-bottom: clamp(20px, 5vw, 32px);
    }

    /* Buttons */
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: "Nunito", sans-serif;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active { transform: scale(0.93) !important; }

    #btn-yes {
      background: linear-gradient(135deg, #ff6fa8, #e040a0);
      color: #fff;
      font-size: clamp(1.1rem, 4.5vw, 1.3rem);
      padding: clamp(14px, 4vw, 18px) clamp(26px, 8vw, 38px);
      box-shadow: 0 8px 24px rgba(224,64,160,0.4);
      transition: font-size 0.35s ease, padding 0.35s ease, box-shadow 0.2s, transform 0.15s;
    }

    #btn-yes:hover { box-shadow: 0 12px 32px rgba(224,64,160,0.55); transform: translateY(-3px) scale(1.04); }

    #btn-no {
      background: linear-gradient(135deg, #b0b0b0, #888);
      color: #fff;
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      padding: clamp(11px, 3.5vw, 14px) clamp(20px, 6vw, 28px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      transition: font-size 0.35s ease, padding 0.35s ease, box-shadow 0.2s, transform 0.15s;
    }

    #no-message {
      min-height: 26px;
      font-size: clamp(0.82rem, 3vw, 0.95rem);
      color: #c06090;
      font-weight: 700;
      margin-top: 16px;
      opacity: 0;
      transition: opacity 0.4s;
    }

    /* YES screen */
    #yes-screen { display: none; animation: cardIn 0.7s cubic-bezier(.34,1.56,.64,1) both; }

    #yes-screen .big-cat {
      font-size: clamp(5rem, 20vw, 7rem);
      display: block;
      line-height: 1;
      animation: catSpin 0.6s ease;
    }

    @keyframes catSpin {
      0%   { transform: rotate(-15deg) scale(0.5); }
      60%  { transform: rotate(10deg) scale(1.15); }
      100% { transform: rotate(0deg) scale(1); }
    }

    #yes-screen h2 {
      font-size: clamp(1.6rem, 7vw, 2rem);
      font-weight: 900;
      color: #c0336e;
      margin: 14px 0 10px;
    }

    #yes-screen p {
      color: #c06090;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      line-height: 1.6;
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      border-radius: 2px;
      animation: confettiFall linear forwards;
      z-index: 999;
      pointer-events: none;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="hearts-bg" id="hearts-bg"></div>

<div class="card" id="main-card">

  <!-- Pantalla pregunta -->
  <div id="question-screen">
    <span class="cat-container" id="main-cat">🐱</span>
    <h1>Oye, tengo que preguntarte algo importante… 💕</h1>
    <p class="subtitle">¿Quieres ser mi novia? El gatito también quiere saber 👇</p>
    <div class="buttons">
      <button class="btn" id="btn-yes" onclick="handleYes()">💖 ¡Sí, quiero!</button>
      <button class="btn" id="btn-no"  onclick="handleNo()">No…</button>
    </div>
    <p id="no-message"></p>
  </div>

  <!-- Pantalla YES -->
  <div id="yes-screen">
    <span class="big-cat">😻</span>
    <h2>¡YAYYYY! 🎉💕</h2>
    <p>Tú y yo, desde ahora.<br>El gatito está muy feliz… y yo también. 🐾❤️</p>
  </div>

</div>

<script>
  // Fondo animado
  const emojis = ["💕","💗","💖","🩷","🌸","✨","🐾","💝","🐱"];
  const bg = document.getElementById("hearts-bg");
  const count = window.innerWidth < 480 ? 14 : 22;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "heart-float";
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (5 + Math.random() * 8) + "s";
    el.style.animationDelay = (Math.random() * 8) + "s";
    el.style.fontSize = (0.9 + Math.random() * 1.3) + "rem";
    bg.appendChild(el);
  }

  // Lógica botones
  let noCount = 0;
  const noMessages = [
    "Psst… el gatito se puso triste 🐱💔",
    "¿Segura? El gatito llora… 😿",
    "Nooo, dale otra oportunidad al amor 🥺",
    "Mira qué chiquito quedó el no… 👀",
    "El sí es mucho más bonito, ¿no? 💕",
    "El gatito dice que pienses bien… 🐾",
    "¡Ya casi no puedes presionar el no! 😅",
    "Acéptalo, el sí te está llamando 💖",
    "El no está desapareciendo… 👻",
    "¡Última oportunidad del no! 🙈"
  ];

  const yesBtn  = document.getElementById("btn-yes");
  const noBtn   = document.getElementById("btn-no");
  const noMsg   = document.getElementById("no-message");
  const mainCat = document.getElementById("main-cat");
  const sadCats = ["😿","🙀","😾","😿","🙀"];

  // Tamaños base responsivos
  const isMobile = window.innerWidth < 480;
  const baseYes  = isMobile ? 1.1 : 1.3;
  const baseNo   = isMobile ? 0.9 : 1.1;

  function handleNo() {
    noCount++;

    // Encoge el No
    const noSize = Math.max(0.38, baseNo - noCount * 0.07);
    const noPad  = Math.max(3, (isMobile ? 11 : 14) - noCount * 1.1);
    noBtn.style.fontSize = noSize + "rem";
    noBtn.style.padding  = noPad + "px " + (noPad * 2) + "px";

    // Agranda el Sí
    const yesSize = Math.min(isMobile ? 2.4 : 2.8, baseYes + noCount * 0.12);
    const yesPad  = Math.min(isMobile ? 28 : 34, (isMobile ? 14 : 18) + noCount * 1.5);
    yesBtn.style.fontSize = yesSize + "rem";
    yesBtn.style.padding  = yesPad + "px " + Math.round(yesPad * 2.1) + "px";

    // Gatito triste
    mainCat.textContent = sadCats[Math.min(noCount - 1, sadCats.length - 1)];

    // Mensaje
    noMsg.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
    noMsg.style.opacity = "1";

    if (noSize <= 0.38) noBtn.style.visibility = "hidden";
  }

  function handleYes() {
    document.getElementById("question-screen").style.display = "none";
    document.getElementById("yes-screen").style.display = "block";
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ["#ff6fa8","#ffb3d1","#e040a0","#ffd700","#a78bfa","#34d399"];
    const pieces = isMobile ? 65 : 100;
    for (let i = 0; i < pieces; i++) {
      setTimeout(() => {
        const el = document.createElement("div");
        el.className = "confetti-piece";
        el.style.left = Math.random() * 100 + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width  = (6 + Math.random() * 9) + "px";
        el.style.height = (6 + Math.random() * 9) + "px";
        el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        el.style.animationDuration = (2 + Math.random() * 2.5) + "s";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }, i * 40);
    }
  }
</script>
</body>
</html>
